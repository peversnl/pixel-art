<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1,
                 user-scalable=no, viewport-fit=cover">
  <title>PixelKleur</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="screen-library" class="screen">
      <header class="library-header">
        <h1 id="library-title">PixelKleur</h1>
      </header>
      <div id="library-status" class="library-status" role="status" hidden></div>
      <div id="library-grid" class="library-grid"></div>
    </section>

    <section id="screen-puzzle" class="screen" hidden></section>

    <section id="screen-complete" class="screen" hidden></section>
  </div>

  <div id="confirm-dialog" class="dialog" hidden>
    <div class="dialog-box">
      <p id="confirm-dialog-message"></p>
      <div class="dialog-actions">
        <button id="confirm-dialog-cancel" type="button" class="dialog-button"></button>
        <button id="confirm-dialog-ok" type="button" class="dialog-button dialog-button-danger"></button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
