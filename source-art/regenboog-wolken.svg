    <circle cx="115" cy="425" r="52" fill="#FFFFFF"/>
    <circle cx="165" cy="445" r="40" fill="#FFFFFF"/>
    <rect x="55" y="440" width="140" height="40" fill="#FFFFFF" stroke="none"/>
