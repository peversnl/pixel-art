  <path d="M40,460 A216,216 0 0 1 472,460" fill="none" stroke="#E63946" stroke-width="34"/>
  <path d="M74,460 A182,182 0 0 1 438,460" fill="none" stroke="#F5A623" stroke-width="34"/>
  <path d="M108,460 A148,148 0 0 1 404,460" fill="none" stroke="#F4E04D" stroke-width="34"/>
  <path d="M142,460 A114,114 0 0 1 370,460" fill="none" stroke="#4CAF50" stroke-width="34"/>
  <path d="M176,460 A80,80 0 0 1 336,460" fill="none" stroke="#4A90D9" stroke-width="34"/>
  <path d="M210,460 A46,46 0 0 1 302,460" fill="none" stroke="#9B59B6" stroke-width="34"/>
