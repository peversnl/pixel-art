  <!-- sun -->
  <circle cx="256" cy="120" r="50" fill="#F4E04D" stroke="#2B2B2B" stroke-width="6"/>
  <path d="M256,45 L256,20 M256,220 L256,195 M181,120 L156,120 M356,120 L331,120
